<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay with UPI</title>
<style>
  :root { --bg:#f6f7f9; --fg:#111; --btn:#1a73e8; }
  body { margin:0; padding:24px 16px; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); text-align:center; }
  h1 { font-size:22px; margin:0 0 4px; }
  p  { margin:6px 0; color:#555; }
  .amt { font-size:36px; font-weight:700; margin:12px 0 20px; }
  a.btn { display:block; margin:10px auto; max-width:360px; padding:16px; border-radius:12px;
          background:var(--btn); color:#fff; text-decoration:none; font-size:18px; font-weight:600; }
  a.btn.alt { background:#fff; color:#111; border:1px solid #ccc; }
  code { background:#eee; padding:2px 6px; border-radius:6px; }
  #log { font-size:12px; color:#888; margin-top:24px; white-space:pre-wrap; text-align:left; }
</style>
</head>
<body>
  <h1>PhonePe</h1>
  <p>VPA: <code id="vpa"></code></p>
  <div class="amt" id="amt"></div>

  <a class="btn" id="btn-upi"   href="#">Pay with UPI (choose app)</a>
  <a class="btn alt" id="btn-gpay"  href="#">Google Pay</a>
  <a class="btn alt" id="btn-phonepe" href="#">PhonePe (intent)</a>
  <a class="btn alt" id="btn-paytm" href="#">Paytm (intent)</a>
  <a class="btn" id="btn-phonepe-p2p" href="#" style="background:#5f259f">PhonePe (send money)</a>
  <a class="btn" id="btn-paytm-p2p" href="#" style="background:#00b9f1">Paytm (send money)</a>

  <p style="margin-top:20px">If no button opens an app: open this page in Chrome<br>(menu ⋮ → "Open in browser") or copy the VPA and pay manually.</p>
  <div id="log"></div>

<script>
  // Static merchant QR params (decoded from phonepe.jpeg). Override via querystring: ?am=...&tn=...
  var q  = new URLSearchParams(location.search);
  var pa = q.get('pa') || 'Q667608845@ybl';
  var pn = q.get('pn') || 'PhonePe';
  // F2 style: unique paise per order (100 -> 99.xx) so the credit is matchable in the statement
  var am = q.get('am') || (100 - (Math.floor(Math.random()*99)+1)/100).toFixed(2);
  var ref = 'LP' + Date.now().toString(36).toUpperCase();   // unique per load, goes in tn + tr
  var tn = q.get('tn') || ref;
  var tr = q.get('tr') || ref;

  var fixed = 'mode=02';   // field from the QR, keep verbatim

  var params = 'pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn)
             + '&' + fixed
             + '&tr=' + encodeURIComponent(tr)
             + '&am=' + encodeURIComponent(am) + '&cu=INR'
             + (tn ? '&tn=' + encodeURIComponent(tn) : '');

  var isAndroid = /Android/i.test(navigator.userAgent);
  var upi    = 'upi://pay?' + params;
  var intent = 'intent://pay?' + params + '#Intent;scheme=upi;end';

  document.getElementById('vpa').textContent = pa;
  document.getElementById('amt').textContent = '₹ ' + am;
  document.getElementById('btn-upi').href     = isAndroid ? intent : upi;
  document.getElementById('btn-gpay').href    = 'tez://upi/pay?' + params;
  document.getElementById('btn-phonepe').href = 'phonepe://pay?' + params;
  document.getElementById('btn-paytm').href   = 'paytmmp://pay?' + params;

  // F2PAY style: apps' own P2P "send money" screens, not the merchant intent
  var pp = {contactInfo:{cbsName:pn, vpa:pa, type:'VPA'},
            sendParams:{note:tn, initialAmount: Math.round(parseFloat(am)*100)},
            validateDestination:false, withSheetExpanded:true, shouldShowUnsavedBanner:false};
  document.getElementById('btn-phonepe-p2p').href = 'phonepe://native?data=' + btoa(JSON.stringify(pp)) + '&id=p2pContactChat';
  document.getElementById('btn-paytm-p2p').href   = 'paytmmp://cash_wallet?pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn)
      + '&tn=' + encodeURIComponent(tn) + '&am=' + encodeURIComponent(am) + '&cu=INR&featuretype=money_transfer';

  document.getElementById('log').textContent =
    'UA: ' + navigator.userAgent + '\nupi link: ' + upi + '\nref: ' + ref;
</script>
</body>
</html>
